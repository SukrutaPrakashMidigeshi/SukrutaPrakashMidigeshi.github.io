# =========================================================

# ------------ Basic Site Settings ------------
locale: "en-US"
site_theme: "default"
title: "Sukruta Prakash Midigeshi"
title_separator: "-"
name: "Sukruta Prakash Midigeshi"

description: "Sukruta Prakash Midigeshi is an Applied Scientist at Amazon and former Research Fellow at Microsoft Research, working on bandit algorithms, online learning, algorithmic game theory and LLM reasoning."
url: "https://sukrutaprakashmidigeshi.github.io"
baseurl: ""
repository: "SukrutaPrakashMidigeshi/SukrutaPrakashMidigeshi.github.io"


# ------------ Author Sidebar Settings ------------
author:
  avatar: "Image_profile.jpg"
  name: "Sukruta Prakash Midigeshi"
  bio: "Applied Scientist, Amazon. Previously Research Fellow, Microsoft Research India."
  location: "India"
  employer: "Amazon"
  email: "sukruta.midigeshi@gmail.com"

  # Academic profiles
  googlescholar: "https://scholar.google.com/citations?user=oAIcmQUAAAAJ"
  arxiv:
  researchgate:
  orcid:
  openreview: "https://openreview.net/profile?id=~Sukruta_Prakash_Midigeshi1"
  semantic:
  scopus:

  # Code/software profiles
  github: "Sukruta02"
  kaggle:

  # Social media
  linkedin: "sukruta-midigeshi"
  twitter:
  instagram:
  facebook:
  youtube:

  # Other optional IDs
  stackoverflow:
  medium:
  goodreads:


# ------------ Publication Categories ------------
publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"
  workshops:
    title: "Workshop Papers"


# ------------ Site Settings ------------
teaser:
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

comments:
  provider: false

atom_feed:
  hide: false
  path:

# ------------ SEO ------------
google_site_verification:   # paste the code from Google Search Console here
bing_site_verification:
alexa_site_verification:
yandex_site_verification:

og_image: "Image_profile.jpg"
og_description: "Personal website of Sukruta Prakash Midigeshi: bandits, online learning, algorithmic game theory and LLM reasoning."

social:
  type: Person
  name: "Sukruta Prakash Midigeshi"
  links:
    - "https://scholar.google.com/citations?user=oAIcmQUAAAAJ"
    - "https://www.linkedin.com/in/sukruta-midigeshi"
    - "https://github.com/Sukruta02"
    - "https://openreview.net/profile?id=~Sukruta_Prakash_Midigeshi1"


# ------------ Analytics ------------
analytics:
  provider: "false"
  google:
    tracking_id:


# ------------ Reading Files ------------
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Gemfile
  - LICENSE
  - node_modules
  - package.json*
  - README
  - vendor
  - CONTRIBUTING.md
  - Dockerfile
  - docker-compose.yaml
  - markdown_generator
  - scripts
  - talkmap
  - talkmap.ipynb
  - talkmap_out.ipynb
  - talkmap.py
  - README.md

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# ------------ Conversion Settings ------------
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo


# ------------ Collections (Publications, Teaching, etc.) ------------
collections:
  teaching:
    output: true
    permalink: /teaching/:path/
  publications:
    output: true
    permalink: /publication/:path/
  portfolio:
    output: true
    permalink: /portfolio/:path/
  talks:
    output: true
    permalink: /talks/:path/


# ------------ Default Layouts ------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true


# ------------ Sass ------------
sass:
  sass_dir: _sass
  style: compressed


# ------------ Output Settings ------------
permalink: /:title/
timezone: Asia/Kolkata


# ------------ Plugins ------------
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# ------------ Archive Pages ------------
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/


# ------------ HTML Compression ------------
compress_html:
  clippings: all
  ignore:
    envs: development
